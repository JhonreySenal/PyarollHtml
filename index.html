<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll System</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-logo">
          <h2>PAYROLL</h2>
        </div>
        
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#cardsc">About</a></li>
                <li><a href="#contactsc">Contact</a></li>
            </ul>
    </nav>
<div class="container">
<div class="payroll-form">
    <h2>Payroll System</h2>

    <div class="form">
        <label for="employeeName" id="employee-label">Employee Name:</label>
        <input type="text" id="employeeName" name="employeeName" placeholder="Enter your Name">
        <hr>
    </div>

    <div class="form">
        <label for="employeeAge">Age:</label>
        <input type="number" id="employeeAge" name="employeeAge" placeholder="Enter your Age">
        <hr>
    </div>

    <div class="form">
        <label for="employeeAddress">Address:</label>
        <input type="text" id="employeeAddress" name="employeeAddress" placeholder="Enter your Address">
        <hr>
    </div>

    <div class="form">
        <label for="employeeContact">Contact:</label>
        <input type="number" id="employeeContact" placeholder="Enter your Contact Number">
        <hr>
    </div>

    <div class="form">
        <label for="employeeContact">Department:</label>
        <input type="text" id="employeeContact" placeholder="Enter your Department">
        <hr>
    </div>
    <div class="form">
        <label for="employmentType">Employment Type:</label>
        <select id="employmentType" name="employmentType" onchange="updateFields()">
            <option value="full-time">Full-Time</option>
            <option value="part-time">Part-Time</option>
        </select>
    </div>

    <div class="fields" id="fullTimeFields">
        <div class="form">
            <label for="basicSalary">Basic Salary:</label> 
            <input type="text" id="basicSalary" name="basicSalary" placeholder="Enter your Basic Salary">
            <hr>
        </div>
    </div>

    <div class="fields" id="partTimeFields">
        <div class="form">
            <label for="ratePerHour">Rate Per Hour:</label>
            <input type="text" id="ratePerHour" name="ratePerHour" placeholder="Enter your Rate Per Hour">
            <hr>
        </div>
        <div class="form">
            <label for="ratePerHour">Work Days:</label>
            <input type="text" id="ratePerHour" name="ratePerHour" placeholder="Enter your Work Days">
            <hr>
        </div>
        <div class="form">
            <label for="overtimePay">Overtime Pay:</label>
            <input type="text" id="overtimePay" name="overtimePay" placeholder="Enter your Overtime Pay">
            <hr>
        </div>
    </div>
<div class="button">
    <button>Submit</button>
</div>
</div>
</div>

<script>
    function updateFields() {
        const employmentType = document.getElementById('employmentType').value;
        const fullTimeFields = document.getElementById('fullTimeFields');
        const partTimeFields = document.getElementById('partTimeFields');

        if (employmentType === 'full-time') {
            fullTimeFields.classList.add('active');
            partTimeFields.classList.remove('active');
        } else if (employmentType === 'part-time') {
            fullTimeFields.classList.remove('active');
            partTimeFields.classList.add('active');
        }
    }
</script>

</body>
</html>
